name: Bootstrap AgentGuardBench

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified project tree
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | tar -xzf -
          rm -f .github/workflows/bootstrap-agentguardbench.yml
      - name: Commit project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release AgentGuardBench v0.1.0"
          git push
